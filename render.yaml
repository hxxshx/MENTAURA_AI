# Render deployment configuration
# https://render.com/docs/render-yaml

services:
  - type: web
    name: mentaura-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./mentaura.db
      # Add these manually in Render dashboard:
      # GMAIL_ADDRESS, GMAIL_APP_PASSWORD, GEMINI_API_KEY, GEMINI_MODEL
